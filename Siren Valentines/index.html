<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Little Rocks and Bananas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="title">Happy Valentines Day Grandpa</h1>

      <div class="rock" id="rock1" onclick="showMessage('rock1')"></div>
      <div class="rock" id="rock2" onclick="showMessage('rock2')"></div>
      <div class="rock" id="rock3" onclick="showMessage('rock3')"></div>
      <div class="rock" id="rock4" onclick="showMessage('rock4')"></div>
      <div class="rock" id="rock5" onclick="showMessage('rock5')"></div>

      <div class="banana" id="banana1"></div>
      <div class="banana" id="banana2"></div>
      <div class="banana" id="banana3"></div>
      <div class="banana" id="banana4"></div>
      <div class="banana" id="banana5" onclick="" showMessage("rock6")></div>
    </div>

    <div id="messageBox" class="hidden">
      <p id="messageText"></p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
